name: Continuous Integration & Production Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Build, Lint, Test & Coverage Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript Compilation
        run: npm run typecheck

      - name: Automated Tests & Coverage Gate (150+ Tests, >=90% Coverage)
        run: npm run test:coverage

      - name: Production Bundle Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: https://aerispulse.vercel.app

      - name: Verify Repository Size (< 10 MB Constraint)
        run: |
          REPO_SIZE_KB=$(git count-objects -vH | grep "size-pack" | awk '{print $2}' || echo "0")
          echo "Current Git Packed Size: $REPO_SIZE_KB"
